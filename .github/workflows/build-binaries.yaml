name: Build binaries

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'
  APP_DIR: example
  ARTIFACT_NAME: mp_audio_stream-example

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter pub get && flutter test
        working-directory: example

  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: reki2000/mp-build-tools/flutter-build@3f80a91fe7537eefb1c2dbe1cd5b5f3716c7492f
        with:
          target: web
          app-directory: ${{ env.APP_DIR }}
          artifact-name: ${{ env.ARTIFACT_NAME }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

  native:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: android, arch: all, runner: ubuntu-22.04}
          - {target: linux, arch: x64, runner: ubuntu-22.04}
          - {target: linux, arch: arm64, runner: ubuntu-22.04-arm}
          - {target: windows, arch: x64, runner: windows-2022}
          - {target: windows, arch: arm64, runner: windows-11-arm}
          - {target: macos, arch: universal, runner: macos-15}
          - {target: ios, arch: arm64, runner: macos-15}
          - {target: ios-simulator, arch: arm64, runner: macos-15}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: reki2000/mp-build-tools/flutter-build@3f80a91fe7537eefb1c2dbe1cd5b5f3716c7492f
        with:
          target: ${{ matrix.target }}
          architecture: ${{ matrix.arch }}
          app-directory: ${{ env.APP_DIR }}
          artifact-name: ${{ env.ARTIFACT_NAME }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          android-keystore-base64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          android-keystore-password: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          android-key-alias: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          android-key-password: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          ios-certificate-base64: ${{ github.event_name != 'pull_request' && secrets.IOS_CERTIFICATE_BASE64 || '' }}
          ios-certificate-password: ${{ github.event_name != 'pull_request' && secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          ios-profile-base64: ${{ github.event_name != 'pull_request' && secrets.IOS_PROFILE_BASE64 || '' }}
          ios-export-options-base64: ${{ github.event_name != 'pull_request' && secrets.IOS_EXPORT_OPTIONS_BASE64 || '' }}

  complete:
    needs: [tests, web, native]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - run: echo "$GITHUB_SHA" > full-build-success.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-build-success
          path: full-build-success.txt
          retention-days: 90

  pages:
    needs: [tests, web, native]
    if: >-
      !cancelled() && needs.tests.result == 'success' && needs.web.result == 'success' &&
      (needs.native.result == 'success' || needs.native.result == 'skipped') &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: reki2000/mp-build-tools/deploy-pages@3f80a91fe7537eefb1c2dbe1cd5b5f3716c7492f
        with:
          target-folder: ${{ github.ref_name == 'develop' && 'develop' || '' }}
          dry-run: ${{ github.event_name == 'pull_request' }}
